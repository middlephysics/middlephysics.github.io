<style>
/* Layout: a quiet hub page that opens into a three-pane study app (classes / note / links). Cobalt is the only accent; neutrals lean cool. */
:root{
--bg:#f4f5f7;--pn:#ffffff;--tx:#15171c;--mu:#697080;--bd:#e2e5eb;--hv:#eceef2;--ac:#2d55c8;--act:#ffffff;--acs:rgba(45,85,200,.10);--gb:#eef0f4;--dot:#d3d7df;
--sh:0 12px 36px rgba(16,22,40,.14);
--f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
--f-disp:"Instrument Serif",Georgia,"Times New Roman",serif;
--f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--pn:#161920;--tx:#e7e9ee;--mu:#8b92a3;--bd:#262a33;--hv:#1f232b;--ac:#86a2ff;--act:#0e1014;--acs:rgba(134,162,255,.14);--gb:#0b0d10;--dot:#22262e;--sh:0 12px 36px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1014;--pn:#161920;--tx:#e7e9ee;--mu:#8b92a3;--bd:#262a33;--hv:#1f232b;--ac:#86a2ff;--act:#0e1014;--acs:rgba(134,162,255,.14);--gb:#0b0d10;--dot:#22262e;--sh:0 12px 36px rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.i{flex:none;display:block}
button{font:inherit;font-size:13px;font-weight:500;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--bd);background:var(--pn)}
button:hover{background:var(--hv)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ghost{border-color:transparent;background:none;color:var(--mu)}.ghost:hover{color:var(--tx);background:var(--hv)}
.icon{width:32px;padding:0;justify-content:center}
.pri{background:var(--ac);border-color:var(--ac);color:var(--act)}.pri:hover{background:var(--ac);filter:brightness(1.08)}
input,textarea{font:inherit;color:var(--tx);background:var(--hv);border:1px solid transparent;border-radius:8px;padding:7px 10px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
.sp{flex:1}
.top{display:flex;align-items:center;gap:8px;height:52px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--pn);border-bottom:1px solid var(--bd);flex:none}
.br{font-weight:600;letter-spacing:-.01em;font-size:15px}
.crumb{font-family:var(--f-disp);font-size:22px;line-height:1}

/* Hub */
#hub{min-height:100%;display:flex;flex-direction:column}
.hubm{width:100%;max-width:980px;margin:0 auto;padding-block:64px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.eyebrow{margin:0;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.wel{margin:0;font:400 clamp(44px,8vw,76px)/1.02 var(--f-disp);letter-spacing:-.015em;text-wrap:balance}
.wel em{color:var(--ac)}
.lede{margin:0 0 28px;color:var(--mu);font-size:16px;max-width:46ch}
.spaces{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.tile{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tl-k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.tile h2{margin:0;font:400 40px/1 var(--f-disp)}
.tile h3{margin:0;font-size:13px;font-weight:600}
.tile p{margin:0;color:var(--mu)}
.stats{display:flex;gap:28px;padding:14px 0;border-block:1px solid var(--bd)}
.stats div{display:flex;flex-direction:column}
.stats b{font:500 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mu)}
.clsrow{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--hv)}
.chip i,.rec i,.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.tile .pri{align-self:flex-start;height:38px;padding:0 16px;font-size:14px}
#hrec{display:flex;flex-direction:column}
.rec{height:auto;padding:10px 8px;margin:0 -8px;border:0;background:none;text-align:left;gap:12px;border-radius:8px}
.rec span{flex:1;min-width:0;display:flex;flex-direction:column}
.rec b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec small{color:var(--mu);font-size:12px}
.rec .i{color:var(--mu)}
.mu{color:var(--mu)}
@media(max-width:720px){.spaces{grid-template-columns:1fr}.hubm{padding-block:40px 32px}}

/* School */
#school{height:100%;display:flex;flex-direction:column}
.seg{display:flex;background:var(--hv);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:26px;padding:0 14px;color:var(--mu);border-radius:7px}
.seg button.on{background:var(--pn);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{flex:1;display:flex;min-height:0;position:relative}
#mb{display:none}
#side{width:272px;flex:none;display:flex;flex-direction:column;background:var(--pn);border-right:1px solid var(--bd);padding:12px 0;gap:10px}
#side>input{margin:0 12px}
#sl{flex:1;overflow:auto;padding-bottom:8px}
.cl,.fo,.ni{display:flex;align-items:center;gap:6px;min-width:0}
.cl{padding:14px 10px 4px 8px}
.cl b{flex:1;min-width:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fo{height:30px;padding-right:8px;margin:0 6px;border-radius:7px;color:var(--tx)}
.fo b{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fo>.i{color:var(--mu)}
.fo:hover{background:var(--hv)}
.ni{height:30px;padding:0 6px 0 10px;margin:1px 6px;border-radius:7px;cursor:pointer;color:var(--tx)}
.ni span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni:hover{background:var(--hv)}
.ni.on{background:var(--acs);color:var(--ac);font-weight:500}
.x{height:24px;width:24px;padding:0;justify-content:center;border:0;background:none;color:var(--mu);opacity:0;border-radius:6px}
.x:hover{color:var(--tx);background:var(--hv)}
.x.cf{width:auto;padding:0 6px;opacity:1;color:#d23c3c;font-size:12px}
.cl:hover .x,.fo:hover .x,.ni:hover .x,.x:focus-visible{opacity:1}
.cv{height:20px;width:20px;padding:0;justify-content:center;border:0;background:none;color:var(--mu)}
.cv .i{transition:transform .15s}.cv.open .i{transform:rotate(90deg)}
label.dot{position:relative;width:10px;height:10px;border-radius:50%;overflow:hidden;cursor:pointer;flex:none}
label.dot input{position:absolute;inset:-6px;width:22px;height:22px;opacity:0;cursor:pointer;padding:0}
.rn{flex:1;min-width:0;padding:2px 8px;height:24px}
.dr{background:var(--hv);outline:1.5px dashed var(--ac);outline-offset:-2px}
#ft{padding:0 12px}#ft button{width:100%;justify-content:center}
#bp{padding:0 12px;display:flex;flex-direction:column;gap:6px}
#bt{height:90px;font:12px/1.4 var(--f-mono)}

#nv,#gv,#bv{flex:1;display:flex;flex-direction:column;min-width:0}
#nv{overflow:auto}
.pg{display:flex;flex-direction:column;flex:1;width:100%;max-width:760px;margin:0 auto;padding:22px 24px 0}
.tr{display:flex;align-items:center;gap:6px}
#ti{flex:1;min-width:0;background:none;border:0;border-radius:0;padding:4px 0;font:400 42px/1.15 var(--f-disp);letter-spacing:-.01em}
#ti::placeholder{color:var(--mu)}
#meta{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px;padding:2px 0 8px}
.tb{display:flex;align-items:center;gap:2px;padding:6px 0;overflow-x:auto;white-space:nowrap;border-block:1px solid var(--bd)}
.tb button{border:0;background:none;color:var(--mu);height:30px;min-width:30px;padding:0 8px;justify-content:center}
.tb button:hover{color:var(--tx);background:var(--hv)}
.tb .sep{width:1px;height:18px;background:var(--bd);margin:0 6px;flex:none}
.tb .fmt{font:400 18px/1 var(--f-disp);width:30px;padding:0}
.tb .fmt-b{font-weight:700;font-family:var(--f-body);font-size:14px}
.tb .fmt-i{font-style:italic;font-size:20px}
.tb .fmt-u{text-decoration:underline;text-underline-offset:3px;font-family:var(--f-body);font-size:14px}
.tb .ins{color:var(--tx);border:1px solid var(--bd);margin-right:4px}
.tb .hd2{font:600 13px/1 var(--f-body)}
#ed{flex:1;min-height:240px;padding:18px 0 48px;outline:none;font-size:16px;line-height:1.75}
#ed:empty:before{content:"Start writing. Type / to insert, [[ to link a note.";color:var(--mu)}
#ed h1{font-size:1.75em;margin:.7em 0 .3em;letter-spacing:-.02em;line-height:1.2;font-weight:600}
#ed h2{font-size:1.35em;margin:.7em 0 .3em;line-height:1.25;font-weight:600}
#ed h3{font-size:1.1em;margin:.7em 0 .2em;font-weight:600}
#ed blockquote{margin:.6em 0;padding:2px 14px;border-left:2px solid var(--ac);color:var(--mu)}
#ed pre{background:var(--hv);padding:10px 12px;border-radius:8px;overflow:auto;font:14px/1.55 var(--f-mono)}
#ed hr{border:0;border-top:1px solid var(--bd);margin:1em 0}
#ed ul,#ed ol{padding-left:1.4em}
#ed a.wl{color:var(--ac);text-decoration:none;background:var(--acs);border-radius:5px;padding:1px 5px;cursor:pointer;font-weight:500;white-space:nowrap}
#ed a.wl:hover{text-decoration:underline;text-underline-offset:3px}
#ed a.wl.miss{background:none;color:var(--mu);text-decoration:underline dashed;text-underline-offset:3px}
.td{display:flex;gap:8px;align-items:baseline}
.pdf{margin:.8em 0;position:relative;max-width:100%}
.pdf iframe{width:100%;height:75vh;border:1px solid var(--bd);border-radius:10px;background:#fff}
.ph{display:flex;align-items:center;gap:8px;padding:4px 2px 6px;font-size:13px;color:var(--mu)}
.ph span{flex:1;display:flex;align-items:center;gap:6px}
.rz{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;border-radius:50%;background:var(--ac);cursor:nwse-resize}
#lk{border-top:1px solid var(--bd);padding:10px 0 16px;font-size:13px;background:var(--bg);position:sticky;bottom:0;display:flex;flex-direction:column;gap:6px}
#lk div{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#lk small{color:var(--mu);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-right:4px;min-width:84px}
.ch{height:26px;border-radius:99px;padding:0 11px;color:var(--ac);background:var(--acs);border:0}
.ch.ms{background:none;border:1px dashed var(--bd);color:var(--mu)}

#sm,#xm{position:fixed;z-index:20;background:var(--pn);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:6px}
#sm{width:280px;max-height:300px;overflow:auto}
.si{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.si.on{background:var(--hv)}
.si>span:last-child{min-width:0}
.si b{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.si small{color:var(--mu);font-size:12px}
.gl{flex:none;width:30px;height:30px;border-radius:7px;border:1px solid var(--bd);display:grid;place-items:center;font:600 12px/1 var(--f-body);color:var(--mu);background:var(--bg)}
.smh{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);padding:6px 8px 4px}
#xm{width:240px;display:flex;flex-direction:column;gap:2px}
#xm button{border:0;background:none;justify-content:flex-start;width:100%;height:34px}
#xm button:hover{background:var(--hv)}
#xm button small{margin-left:auto;color:var(--mu);font:12px var(--f-mono)}
#xm hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;box-shadow:var(--sh);max-width:calc(100% - 32px)}

/* Graph */
#sv{flex:1;width:100%;touch-action:none;background:radial-gradient(var(--dot) 1.2px,transparent 1.2px) 0 0/24px 24px,var(--gb);cursor:grab}
#sv text{fill:var(--tx);font:500 11px var(--f-body);pointer-events:none}
#sv line{stroke:var(--mu);stroke-opacity:.45;stroke-width:1.2}
#sv line.hi{stroke:var(--ac);stroke-opacity:1;stroke-width:2}
#sv .dim{opacity:.13}
.nd{cursor:pointer;transition:opacity .15s}
.nd circle{fill:currentColor}
.nd.gh circle{fill:none;stroke:currentColor;stroke-width:1.5;stroke-dasharray:2 2}
.hl{fill-opacity:.06;stroke-opacity:.35;stroke-dasharray:5 5}
#sv .hlb{font-size:12px;font-weight:600;letter-spacing:.03em}
#gb{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--pn);border-top:1px solid var(--bd)}
#gb span{flex:1;display:flex;flex-direction:column}#gb small{color:var(--mu)}
#gf{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--pn);border-top:1px solid var(--bd);font-size:12px;color:var(--mu)}
#lg{flex:1;display:flex;gap:12px;flex-wrap:wrap;margin-left:8px}
#lg span{display:inline-flex;align-items:center;gap:6px}
#lg i{display:inline-block;width:8px;height:8px;border-radius:50%}

/* Board */
#bt2{display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap;border-bottom:1px solid var(--bd);background:var(--pn)}
.sel{position:relative;display:inline-flex;max-width:220px}
.sel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;font-weight:500;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;height:32px;padding:0 30px 0 12px;max-width:100%;text-overflow:ellipsis;cursor:pointer}
.sel select:hover{background:var(--hv)}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--mu);border-bottom:1.6px solid var(--mu);transform:translateY(-70%) rotate(45deg);pointer-events:none}
#bk.on{background:var(--acs);color:var(--ac);border-color:var(--ac)}
#bs{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(var(--dot) 1.2px,transparent 1.2px) 0 0/24px 24px,var(--gb)}
#bs[data-e]:after{content:"Double-click anywhere to add a card";position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);pointer-events:none}
#bw{position:absolute;left:0;top:0;transform-origin:0 0}
#bl{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;color:var(--mu)}#bl line{stroke:currentColor;stroke-width:1.6}
.cd{position:absolute;display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--bd);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 22px rgba(0,0,0,.08)}
.cd.sel2{outline:2px solid var(--ac)}
.hd{display:flex;align-items:center;gap:4px;padding:4px 6px 2px 12px;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);cursor:grab}
.cd.tint .hd{color:rgba(0,0,0,.45)}
.hd span{flex:1}
.cb{height:22px;width:22px;padding:0;justify-content:center;border:0;background:none;color:inherit;border-radius:6px}
.cb:hover{background:rgba(127,127,127,.15)}
.sw{width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor}
.ct,.nt{flex:1;min-height:0;overflow:auto;padding:2px 12px 10px;outline:none;white-space:pre-wrap;word-break:break-word}
.nt{font-weight:600;cursor:pointer;color:var(--ac)}
.rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}

@media(max-width:760px){
#mb{display:inline-flex}
.crumb,.lbl{display:none}
#side{position:absolute;inset:0 auto 0 0;z-index:5;width:84%;max-width:320px;transform:translateX(-100%);transition:transform .2s}
#side.open{transform:none;box-shadow:var(--sh)}
#ti{font-size:32px}.pg{padding:14px 16px 0}
.seg button{padding:0 10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const $=s=>document.querySelector(s),K='classnotes-v1';
const IC={menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',fplus:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/>',
chev:'<path d="M9 6l6 6-6 6"/>',back:'<path d="M15 6l-6 6 6 6"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
link:'<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/>',
olist:'<path d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1v5M3.5 14.5a1.5 1.5 0 1 1 2.5 1L3.5 19H6"/>',
dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',theme:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>',
check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',quote:'<path d="M7 7h4v4c0 3-1.5 5-4 6M14 7h4v4c0 3-1.5 5-4 6"/>',grid:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M10 4v11M4 15h16"/>'};
const ic=(n,s=16)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
document.querySelectorAll('i[data-i]').forEach(e=>e.outerHTML=ic(e.dataset.i));
const P=['#2d55c8','#14b8a6','#f59e0b','#ec4899','#7c6cf0','#84cc16'];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const H=h=>{const d=document.createElement('div');d.innerHTML=h;return d};const nb=s=>s.replace(/\u00a0/g,' ');
const tx=h=>nb(H(h).textContent);
const SEED={"cur":"ol33zvk","classes":[{"id":"epb2jn7","name":"Finance","color":"#b81414"},{"id":"szvnw8w","name":"Operations","color":"#0a83f5"},{"id":"oo7kmwg","name":"Leadership","color":"#ec7709"},{"id":"4917loi","name":"Marketing","color":"#1fd912"}],"notes":[{"id":"vy8ohp2","cid":"epb2jn7","fid":"evuyisb","title":"TVM","body":"Time value of money!!!"},{"id":"ol33zvk","cid":"epb2jn7","fid":"evuyisb","title":"Exponential Growth","body":"<h2><br></h2><div>Exponential growth is a major factor in [[TVM]]</div><div><br></div><div><br></div><div><br></div>"},{"id":"tuk7718","cid":"szvnw8w","fid":"rmj96kr","title":"Operational Efficiency","body":"This allows for the [[Exponential Growth]] of a corporations money"},{"id":"tyrfzf4","cid":"szvnw8w","fid":"rmj96kr","title":"Benefits","body":""}],"view":"n","folders":[{"id":"evuyisb","cid":"epb2jn7","pid":null,"name":"Week 10"},{"id":"rmj96kr","cid":"szvnw8w","pid":null,"name":"Week 10"},{"id":"lfd8kao","cid":"oo7kmwg","pid":null,"name":"Week 10"},{"id":"1zaavnl","cid":"4917loi","pid":null,"name":"Week 10"}],"col":{"43tdj7u":false,"epb2jn7":true,"evuyisb":false,"szvnw8w":true,"oo7kmwg":true,"4917loi":true,"rmj96kr":false},"boards":{"epb2jn7":{"cards":[{"id":"7lnydyn","x":341.64,"y":-62.98,"w":210,"h":130,"c":5,"t":"Fortnite"},{"id":"3j5a62s","x":491.76,"y":140.05,"w":210,"h":130,"c":1,"t":"Pleasant park"},{"id":"822drdp","x":189.93,"y":137.21,"w":210,"h":130,"c":1,"t":"Golden Scar"},{"id":"ows60s3","x":495.04,"y":298.82,"w":210,"h":130,"c":4,"t":"\n"},{"id":"a46p9bh","x":731.85,"y":409.02,"w":200,"h":90,"c":0,"t":"","nid":"vy8ohp2"},{"id":"vee6nko","x":1423.97,"y":-151.74,"w":254.88,"h":86.85,"c":1,"t":"Components of Finance"},{"id":"nrr859c","x":1177.26,"y":-6.39,"w":210,"h":130,"c":2,"t":"Money"},{"id":"f0xsr53","x":1435.94,"y":-9.21,"w":210,"h":130,"c":2,"t":"Efficiency"},{"id":"2jn5id8","x":1676.02,"y":-9.43,"w":210,"h":130,"c":2,"t":"Efficacy"},{"id":"e9ktog0","x":1057.89,"y":196.61,"w":200,"h":90,"c":0,"t":"","nid":"ol33zvk"}],"links":[["3j5a62s","7lnydyn"],["822drdp","7lnydyn"],["ows60s3","3j5a62s"],["a46p9bh","ows60s3"],["2jn5id8","vee6nko"],["f0xsr53","vee6nko"],["nrr859c","vee6nko"],["f0xsr53","nrr859c"],["e9ktog0","nrr859c"],["e9ktog0","vee6nko"]]},"szvnw8w":{"cards":[],"links":[]}}};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.notes||!S.notes.length)S=JSON.parse(JSON.stringify(SEED));
function norm(){S.folders=S.folders||[];S.col=S.col||{};S.notes.forEach(n=>n.body=mig(n.body||''))}
function mig(html){if(html.indexOf('[[')<0)return html;const d=H(html);const w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT),ts=[];
while(w.nextNode())if(/\[\[[^\[\]]+\]\]/.test(w.currentNode.textContent))ts.push(w.currentNode);
ts.forEach(t=>{const f=document.createDocumentFragment(),s=t.textContent;let last=0;s.replace(/\[\[([^\[\]]+)\]\]/g,(m,x,i)=>{f.append(s.slice(last,i));const a=document.createElement('a');a.className='wl';a.setAttribute('contenteditable','false');a.dataset.t=x.trim();a.textContent=x.trim();f.append(a);last=i+m.length;return m});f.append(s.slice(last));t.replaceWith(f)});
return d.innerHTML}
norm();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
save();
let _db;const db=()=>_db||(_db=new Promise((ok,no)=>{try{const r=indexedDB.open('classnotes-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=no}catch(e){no(e)}}));
const dbPut=async(k,v)=>{const d=await db();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=ok;t.onerror=no})};
const dbGet=async k=>{try{const d=await db();return await new Promise((ok,no)=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>ok(q.result);q.onerror=no})}catch(e){}};
const bodyHTML=()=>{const c=$('#ed').cloneNode(true);c.querySelectorAll('.pdf').forEach(p=>p.innerHTML='');c.querySelectorAll('a.wl').forEach(a=>a.classList.remove('miss'));return c.innerHTML};
async function hyd(){for(const p of $('#ed').querySelectorAll('.pdf')){if(p.firstChild)continue;const b=await dbGet(p.dataset.pdf),nm=esc(p.dataset.name||'PDF');
if(!b){p.innerHTML=`<div class="ph"><span>${ic('file')}${nm}</span>Not stored in this browser</div>`;continue}
p.innerHTML=`<div class="ph"><span>${ic('file')}${nm}</span><button data-x="1" class="ghost">Remove</button></div><iframe src="${URL.createObjectURL(b)}#view=FitH" style="height:${p.dataset.h||620}px"></iframe><div class="rz"></div>`;if(p.dataset.w)p.style.width=p.dataset.w+'px'}}
let PR=null;
const cur=()=>S.notes.find(n=>n.id==S.cur);
const byT=t=>{t=(t||'').trim().toLowerCase();return t&&S.notes.find(n=>n.title.trim().toLowerCase()==t)};
const OC=new Map();
const outs=n=>{const b=n.body||'';if(OC.has(b))return OC.get(b);const d=H(b);const r=[...new Set([...d.querySelectorAll('a.wl')].map(a=>(a.dataset.t||'').trim()).filter(Boolean))];if(OC.size>500)OC.clear();OC.set(b,r);return r};
const cls=id=>S.classes.find(c=>c.id==id)||{};
const ccol=id=>cls(id).color||'#888',cname=id=>cls(id).name||'';
const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?'just now':m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)};

/* ---------- Hub ---------- */
function hub(){const d=new Date(),h=d.getHours();
$('#hd').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+' · '+(h<12?'Good morning':h<18?'Good afternoon':'Good evening');
const links=S.notes.reduce((s,n)=>s+outs(n).length,0);
$('#hstats').innerHTML=[[S.classes.length,S.classes.length==1?'class':'classes'],[S.notes.length,S.notes.length==1?'note':'notes'],[links,links==1?'link':'links']].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');
$('#hcls').innerHTML=S.classes.map(c=>`<span class="chip"><i style="background:${c.color}"></i>${esc(c.name)}</span>`).join('');
const rec=S.notes.map((n,i)=>[n,n.u||i]).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
$('#hrec').innerHTML=rec.length?rec.map(n=>`<button class="rec" data-id="${n.id}"><i style="background:${ccol(n.cid)}"></i><span><b>${esc(n.title||'Untitled')}</b><small>${esc(cname(n.cid))}${n.u?' · '+ago(n.u):''}</small></span>${ic('chev')}</button>`).join(''):'<p class="mu">No notes yet.</p>'}
function page(p){$('#hub').hidden=p!='hub';$('#school').hidden=p!='school';hideSl();$('#xm').hidden=true;
if(p=='hub'){cancelAnimationFrame(raf);hub()}else{if(!cur())S.cur=S.notes[0].id;open(S.cur,1)}}
$('#enter').onclick=()=>page('school');
$('#home').onclick=()=>page('hub');
$('#hrec').onclick=e=>{const b=e.target.closest('.rec');if(b){S.cur=b.dataset.id;page('school')}};

/* ---------- Sidebar ---------- */
let RN=null,AR=null;
const colp=id=>S.col&&S.col[id];
const cv=id=>`<button class="cv${colp(id)?'':' open'}" data-a="tg" data-id="${id}" aria-label="Expand or collapse">${ic('chev',14)}</button>`;
const xb=(a,id,t,icn)=>`<button class="x${AR==a[1]+id?' cf':''}" data-a="${a}" data-id="${id}" title="${t}">${AR==a[1]+id?'Delete?':ic(icn,14)}</button>`;
const row=(n,d)=>`<div class="ni${n.id==S.cur?' on':''}" draggable="true" style="margin-left:${16+d*14}px" data-a="open" data-id="${n.id}"><span>${esc(n.title||'Untitled')}</span>${xb('dn',n.id,'Delete note','x')}</div>`;
const nm=o=>RN==o.id?`<input class="rn" data-rn="${o.id}" value="${esc(o.name)}">`:`<b>${esc(o.name)}</b>`;
function tree(cid,pid,d){let h='';
S.folders.filter(f=>f.cid==cid&&(f.pid||null)==pid).forEach(f=>{
h+=`<div class="fo" data-drop="f:${f.id}" style="padding-left:${6+d*14}px">${cv(f.id)}${ic('folder',15)}${nm(f)}<button class="x" data-a="ren" data-id="${f.id}" title="Rename">${ic('pen',14)}</button><button class="x" data-a="nsf" data-id="${f.id}" title="New subfolder">${ic('fplus',14)}</button><button class="x" data-a="newf" data-id="${f.id}" title="New note here">${ic('plus',14)}</button>${xb('df',f.id,'Delete folder (notes move up)','x')}</div>`;
if(!colp(f.id))h+=tree(cid,f.id,d+1)});
return h+S.notes.filter(n=>n.cid==cid&&(n.fid||null)==pid).map(n=>row(n,d)).join('')}
function side(){const q=$('#sq').value.toLowerCase();let h='';
S.classes.forEach(c=>{const ns=q?S.notes.filter(n=>n.cid==c.id&&(n.title+' '+tx(n.body)).toLowerCase().includes(q)):0;
if(q&&!ns.length)return;
h+=`<div class="cl" data-drop="c:${c.id}">${q?'':cv(c.id)}<label class="dot" style="background:${c.color}" title="Change color"><input type="color" value="${c.color}" data-col="${c.id}"></label>${nm(c)}<button class="x" data-a="ren" data-id="${c.id}" title="Rename">${ic('pen',14)}</button><button class="x" data-a="nf" data-id="${c.id}" title="New folder">${ic('fplus',14)}</button><button class="x" data-a="new" data-id="${c.id}" title="New note">${ic('plus',14)}</button>${xb('dc',c.id,'Delete class','x')}</div>`;
if(q)h+=ns.map(n=>row(n,0)).join('');else if(!colp(c.id))h+=tree(c.id,null,0)});
$('#sl').innerHTML=h||'<p class="mu" style="padding:0 16px">No matching notes.</p>';const rn=$('#sl .rn');if(rn){rn.focus();rn.select()}}

/* ---------- Notes ---------- */
function markLinks(){$('#ed').querySelectorAll('a.wl').forEach(a=>a.classList.toggle('miss',!byT(a.dataset.t)))}
function lk(){const n=cur(),o=outs(n),t=n.title.trim().toLowerCase();
const bk=S.notes.filter(m=>m.id!=n.id&&t&&outs(m).some(x=>x.toLowerCase()==t));
const ch=(x,id,l)=>`<button class="ch${id?'':' ms'}" data-t="${esc(x)}"${id?` data-id="${id}"`:''} title="${id?'Open note':'Create this note'}">${esc(l||x)}</button>`;
$('#lk').innerHTML=(o.length?`<div><small>Links to</small>${o.map(x=>{const m=byT(x);return ch(x,m&&m.id)}).join('')}</div>`:'')+(bk.length?`<div><small>Linked from</small>${bk.map(m=>ch(m.title,m.id,m.title||'Untitled')).join('')}</div>`:'')||'<div><small>No links yet</small><span class="mu">Type [[ to link another note.</span></div>';
const f=S.folders.find(x=>x.id==n.fid);$('#meta').innerHTML=`<span class="cdot" style="background:${ccol(n.cid)}"></span>${esc(cname(n.cid))}${f?' / '+esc(f.name):''}`}
function show(){const v=S.view||'n';$('#nv').hidden=v!='n';$('#gv').hidden=v!='g';$('#bv').hidden=v!='b';['n','g','b'].forEach(k=>$('#t'+k).classList.toggle('on',v==k));if(v!='g')cancelAnimationFrame(raf);if(v=='g')graph();if(v=='b')board()}
function open(id,keep){S.cur=id;if(!keep||S.view!='b'&&S.view!='g')S.view='n';const n=cur();$('#ti').value=n.title;$('#ed').innerHTML=n.body;markLinks();hyd();hideSl();show();side();lk();save();$('#side').classList.remove('open')}
function newNote(cid,fid,title){const n={id:uid(),cid,fid:fid||null,title:title||'',body:'',u:Date.now()};S.notes.push(n);open(n.id);if(!title)$('#ti').focus();return n}
function goT(t){const m=byT(t);if(m)open(m.id);else{const c=cur();newNote(c.cid,c.fid,t.trim())}}
let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(()=>{lk();markLinks();save()},400)};
const ex=(c,v)=>{$('#ed').focus();document.execCommand(c,false,v||null)};
const fb=t=>ex('formatBlock','<'+t+'>');
const insLink=t=>ex('insertHTML',`<a class="wl" contenteditable="false" data-t="${esc(t)}">${esc(t)}</a>&nbsp;`);
const startLink=()=>ex('insertText','[[');
const SL=[
['Title','Big page title','# h1 title','H1',()=>fb('h1')],
['Heading','Section heading','## h2 heading','H2',()=>fb('h2')],
['Subheading','Smaller heading','### h3','H3',()=>fb('h3')],
['Bold','Make text bold','b bold','<b>B</b>',()=>ex('bold')],
['Italic','Slanted text','i italic','<i style="font:italic 17px var(--f-disp)">I</i>',()=>ex('italic')],
['Underline','Underline text','u underline','<u>U</u>',()=>ex('underline')],
['Strikethrough','Cross text out','s strike','<s>S</s>',()=>ex('strikeThrough')],
['Bullet list','Simple list','- bullet list',ic('list'),()=>ex('insertUnorderedList')],
['Numbered list','Ordered list','1. number list',ic('olist'),()=>ex('insertOrderedList')],
['To-do','Checkbox item','[] todo check',ic('check'),()=>ex('insertHTML','<div class="td"><input type="checkbox" contenteditable="false"><span>&nbsp;</span></div>')],
['Quote','Highlighted quote','> quote',ic('quote'),()=>fb('blockquote')],
['Code block','Monospace block','``` code','&lt;/&gt;',()=>fb('pre')],
['Divider','Horizontal line','--- divider line',ic('minus'),()=>ex('insertHorizontalRule')],
['PDF','Embed a PDF from your computer','pdf file embed',ic('file'),()=>{const s=getSelection();PR=s.rangeCount?s.getRangeAt(0).cloneRange():null;$('#pf').click()}],
['Link note','Link to another note','[[ link note',ic('link'),startLink],
['Cornell notes','Cues, notes and summary','cornell template',ic('grid'),()=>ex('insertHTML','<h2>Cues</h2><p><br></p><h2>Notes</h2><p><br></p><h2>Summary</h2><p><br></p>')]];
let SLs=null;
function hideSl(){SLs=null;$('#sm').hidden=true}
function renderSl(r){const m=$('#sm');
m.innerHTML=(SLs.link?'<div class="smh">Link to note</div>':'')+SLs.list.map((it,i)=>`<div class="si${i==SLs.i?' on':''}" data-i="${i}"><span class="gl">${it.g}</span><span><b>${esc(it.l)}</b><small>${esc(it.s)}</small></span></div>`).join('');
if(r){let b=r.getBoundingClientRect();if(!b.height)b=SLs.n.parentElement.getBoundingClientRect();
const vh=(window.visualViewport||window).height||innerHeight;m.hidden=false;
m.style.left=Math.max(8,Math.min(b.left,innerWidth-288))+'px';
m.style.top=(b.bottom+8+Math.min(300,m.scrollHeight)>vh?Math.max(8,b.top-Math.min(300,m.scrollHeight)-8):b.bottom+8)+'px'}
const o=m.querySelector('.on');if(o)o.scrollIntoView({block:'nearest'})}
function slashCheck(){const s=getSelection();if(!s.rangeCount||!s.isCollapsed)return hideSl();
const r=s.getRangeAt(0),n=r.startContainer;if(n.nodeType!=3||!$('#ed').contains(n))return hideSl();
const before=n.textContent.slice(0,r.startOffset);let m,list,from,link=0;
if(m=/\[\[([^\[\]]*)$/.exec(before)){link=1;const raw=m[1].trim(),q=raw.toLowerCase(),c=cur();from=r.startOffset-m[1].length-2;
list=S.notes.filter(x=>x.id!=S.cur&&x.title.trim()&&x.title.toLowerCase().includes(q)).sort((a,b)=>(b.cid==c.cid)-(a.cid==c.cid)).slice(0,8)
.map(x=>({l:x.title,s:cname(x.cid),g:`<span class="cdot" style="background:${ccol(x.cid)};width:10px;height:10px"></span>`,f:()=>insLink(x.title)}));
if(raw&&!byT(raw))list.push({l:'New note: '+raw,s:'Link now, write it later',g:ic('plus'),f:()=>insLink(raw)})}
else if(m=/(^|\s)\/(\S*)$/.exec(before)){const q=m[2].toLowerCase();from=r.startOffset-q.length-1;
const sc=it=>{const k=it[2].split(' ');return k.includes(q)||it[0].toLowerCase()==q?0:k.some(x=>x.startsWith(q))||it[0].toLowerCase().startsWith(q)?1:9};
list=SL.map((it,i)=>[sc(it),i,it]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>({l:x[2][0],s:x[2][1],g:x[2][3],f:x[2][4]}))}
else return hideSl();
if(!list.length)return hideSl();
SLs={n,from,to:r.startOffset,list,i:0,link};renderSl(r)}
function pick(i){const it=SLs.list[i],r=document.createRange();r.setStart(SLs.n,SLs.from);r.setEnd(SLs.n,SLs.to);r.deleteContents();
const s=getSelection();s.removeAllRanges();s.addRange(r);hideSl();it.f();$('#ed').oninput()}
function autoLink(){const s=getSelection();if(!s.rangeCount||!s.isCollapsed)return;const r=s.getRangeAt(0),n=r.startContainer;if(n.nodeType!=3)return;
const m=/\[\[([^\[\]]+)\]\]$/.exec(n.textContent.slice(0,r.startOffset));if(!m)return;const rg=document.createRange();rg.setStart(n,r.startOffset-m[0].length);rg.setEnd(n,r.startOffset);s.removeAllRanges();s.addRange(rg);insLink(m[1].trim())}
$('#sm').onpointerdown=e=>e.preventDefault();
$('#sm').onclick=e=>{const b=e.target.closest('.si');if(b&&SLs)pick(+b.dataset.i)};
$('#ed').onkeydown=e=>{if(!SLs)return;
if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();SLs.i=(SLs.i+(e.key=='ArrowDown'?1:-1)+SLs.list.length)%SLs.list.length;renderSl()}
else if(e.key=='Enter'||e.key=='Tab'){e.preventDefault();pick(SLs.i)}
else if(e.key=='Escape')hideSl()};

const el=$('#bc').querySelector(`[data-id="${c.id}"]`);el.style.left=c.x+'px';el.style.top=c.y+'px';el.style.width=c.w+'px';el.style.height=c.h+'px';blines()};
$('#bs').onpointerup=()=>{if(BS&&BS.t!='pan')save();BS=null};
$('#bs').onwheel=e=>{e.preventDefault();const r=$('#bs').getBoundingClientRect();bzoom(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)};
$('#bs').ondblclick=e=>{if(e.target.closest('.cd'))return;const r=$('#bs').getBoundingClientRect();addCard((e.clientX-r.left-BV.x)/BV.k-105,(e.clientY-r.top-BV.y)/BV.k-30)};
$('#bc').oninput=e=>{const cd=e.target.closest('.cd');if(cd){bd().cards.find(x=>x.id==cd.dataset.id).t=e.target.innerText;save()}};
$('#ba').onclick=()=>{const[x,y]=ctr();addCard(x-105+Math.random()*60,y-65+Math.random()*60)};
$('#bn').onchange=e=>{if(e.target.value){const[x,y]=ctr();addCard(x-100,y-45,e.target.value)}};
$('#bk').onclick=()=>{CONN=CONN?0:1;FIRST=null;$('#bk').textContent=CONN?'Done connecting':'Connect';$('#bk').classList.toggle('on',!!CONN);board()};
$('#bsel').onchange=e=>{BC=e.target.value;FIRST=null;board()};
$('#bzi').onclick=()=>bzoom(1.25);$('#bzo').onclick=()=>bzoom(.8);

/* ---------- Graph ---------- */
let raf;
function graph(){const sv=$('#sv'),W=sv.clientWidth||360,H=sv.clientHeight||480,cl=S.classes,N=[],ix={},E=[],gh={};
S.notes.forEach(n=>{ix[n.id]=N[N.push({id:n.id,t:n.title||'Untitled',cid:n.cid,deg:0,vx:0,vy:0})-1]});
S.notes.forEach(n=>outs(n).forEach(t=>{const m=byT(t),b=ix[n.id];let c;
if(m){if(m.id==n.id)return;c=ix[m.id]}else{const k=t.toLowerCase();c=gh[k]||(gh[k]=N[N.push({id:'g'+k,t,cid:n.cid,ghost:1,deg:0,vx:0,vy:0})-1])}
E.push([b,c]);b.deg++;c.deg++}));
const R=cl.length>1?Math.min(W,H)*.3:0,an={};
cl.forEach((c,i)=>{const a=i/cl.length*6.283;an[c.id]={x:W/2+Math.cos(a)*R,y:H/2+Math.sin(a)*R}});
const A=d=>an[d.cid]||{x:W/2,y:H/2},rad=d=>d.ghost?4:4+Math.min(d.deg*1.5,9);
N.forEach(d=>{d.x=A(d).x+(Math.random()-.5)*80;d.y=A(d).y+(Math.random()-.5)*80});
sv.innerHTML=`<g id="vp"><g>${cl.map(c=>`<circle class="hl" style="fill:${c.color};stroke:${c.color}"/><text class="hlb" style="fill:${c.color}" text-anchor="middle">${esc(c.name)}</text>`).join('')}</g><g>${E.map(()=>'<line/>').join('')}</g><g>${N.map((d,i)=>`<g class="nd${d.ghost?' gh':''}" data-i="${i}" style="color:${ccol(d.cid)}"><circle r="${rad(d)}"/><text y="${rad(d)+14}" text-anchor="middle">${esc(d.t)}</text></g>`).join('')}</g></g>`;
$('#lg').innerHTML=cl.map(c=>`<span><i style="background:${c.color}"></i>${esc(c.name)}</span>`).join('')+(E.length?'':'<span>Link notes with [[ to connect them.</span>');
const vp=$('#vp'),hls=sv.querySelectorAll('.hl'),hlb=sv.querySelectorAll('.hlb'),lns=sv.querySelectorAll('line'),nds=sv.querySelectorAll('.nd');
let a=1,drag=null,pan=null,mv=0,sel=null,hv=null,V={k:1,x:0,y:0};
const tf=()=>vp.setAttribute('transform',`translate(${V.x},${V.y}) scale(${V.k})`);
const step=()=>{
N.forEach(p=>{N.forEach(q=>{if(p!=q){const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1,f=2800/(d*d);p.vx+=dx/d*f;p.vy+=dy/d*f}});const o=A(p);p.vx+=(o.x-p.x)*.014;p.vy+=(o.y-p.y)*.014});
E.forEach(([p,q])=>{const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1,f=(d-90)*.03;p.vx+=dx/d*f;p.vy+=dy/d*f;q.vx-=dx/d*f;q.vy-=dy/d*f});
N.forEach(p=>{if(p!=drag){p.x+=p.vx*a;p.y+=p.vy*a}p.vx*=.6;p.vy*=.6});
E.forEach(([p,q],i)=>{const l=lns[i];l.setAttribute('x1',p.x);l.setAttribute('y1',p.y);l.setAttribute('x2',q.x);l.setAttribute('y2',q.y)});
N.forEach((p,i)=>nds[i].setAttribute('transform',`translate(${p.x},${p.y})`));
cl.forEach((c,i)=>{const m=N.filter(d=>d.cid==c.id),h=hls[i],b=hlb[i];if(!m.length){h.setAttribute('r',0);b.textContent='';return}
const cx=m.reduce((s,d)=>s+d.x,0)/m.length,cy=m.reduce((s,d)=>s+d.y,0)/m.length,r=Math.max(46,...m.map(d=>Math.hypot(d.x-cx,d.y-cy)+34));
h.setAttribute('cx',cx);h.setAttribute('cy',cy);h.setAttribute('r',r);b.setAttribute('x',cx);b.setAttribute('y',cy-r-7);b.textContent=c.name});
a=Math.max(a*.985,drag?.5:.02);if(a>.03||drag)raf=requestAnimationFrame(step)};
const wake=v=>{a=v;cancelAnimationFrame(raf);raf=requestAnimationFrame(step)};
const paint=()=>{const f=hv!=null?hv:sel,nb=new Set();
if(f!=null)E.forEach(([p,q])=>{if(p==N[f])nb.add(q);if(q==N[f])nb.add(p)});
nds.forEach((g,i)=>g.classList.toggle('dim',f!=null&&i!=f&&!nb.has(N[i])));
lns.forEach((l,i)=>{const on=f!=null&&(E[i][0]==N[f]||E[i][1]==N[f]);l.classList.toggle('hi',on);l.classList.toggle('dim',f!=null&&!on)});
const d=sel!=null&&N[sel],g=$('#gb');g.hidden=!d;
if(d){g.innerHTML=`<span><b>${esc(d.t)}</b><small>${d.deg} link${d.deg==1?'':'s'}${d.ghost?' · not created yet':''}</small></span><button id="go" class="pri">${d.ghost?'Create note':'Open note'}</button>`;
$('#go').onclick=()=>{if(d.ghost)newNote(d.cid,null,d.t);else open(d.id)}}};
const zoom=(f,mx=W/2,my=H/2)=>{const k=Math.max(.3,Math.min(3,V.k*f));V.x=mx-(mx-V.x)*k/V.k;V.y=my-(my-V.y)*k/V.k;V.k=k;tf()};
const pt=e=>{const r=sv.getBoundingClientRect();return[(e.clientX-r.left-V.x)/V.k,(e.clientY-r.top-V.y)/V.k]};
sv.onpointerdown=e=>{const g=e.target.closest('.nd');mv=0;sv.setPointerCapture(e.pointerId);
if(g){drag=N[g.dataset.i];wake(.5)}else pan={x:e.clientX-V.x,y:e.clientY-V.y}};
sv.onpointermove=e=>{if(drag){[drag.x,drag.y]=pt(e);mv++}
else if(pan){V.x=e.clientX-pan.x;V.y=e.clientY-pan.y;mv++;tf()}
else if(e.pointerType=='mouse'){const g=e.target.closest('.nd'),i=g?+g.dataset.i:null;if(i!==hv){hv=i;paint()}}};
sv.onpointerup=()=>{if(drag&&mv<4)sel=N.indexOf(drag);else if(pan&&mv<4)sel=null;drag=pan=null;paint()};
sv.onwheel=e=>{e.preventDefault();const r=sv.getBoundingClientRect();zoom(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)};
$('#zi').onclick=()=>zoom(1.25);$('#zo').onclick=()=>zoom(.8);
$('#gb').hidden=true;cancelAnimationFrame(raf);raf=requestAnimationFrame(step)}

if(!cur())S.cur=S.notes[0].id;
page('hub');
</script>

</body></html>
